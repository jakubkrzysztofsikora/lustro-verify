[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lustro-verify"
version = "0.1.0"
description = "Offline Ed25519 signature verification CLI + library for LUSTRO advisories/corrections"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Projekt LUSTRO" }]
keywords = ["ed25519", "signature-verification", "fimi", "disinformation"]
dependencies = [
    "cryptography>=41.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pyinstaller>=6.0"]

[project.scripts]
lustro-verify = "lustro_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
